<!doctype html>
<html lang="ar" dir="rtl">
<meta charset="utf-8">
<title>MG Group — editable social preview</title>
<style>
@font-face{font-family:PlexAR;src:url('/fonts/IBMPlexSansArabic-Medium.woff2')}@font-face{font-family:Plex;src:url('/fonts/IBMPlexSans-Variable.woff2')}
*{box-sizing:border-box}html,body{margin:0;width:1200px;height:100vh;overflow:hidden;background:#102d40;color:white}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 42%}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,25,40,.34),transparent 32%,rgba(5,25,40,.66) 57%,#081f30 100%)}
.brand{position:absolute;top:25px;left:50%;transform:translateX(-50%);width:248px;height:auto}
.copy{position:absolute;bottom:54px;left:50%;width:600px;transform:translateX(-50%);text-align:center}
h1{font:500 53px/1.28 PlexAR;margin:0 0 9px;text-shadow:0 2px 10px #061824}
.en{direction:ltr;font:500 30px/1.3 Plex;margin:0;letter-spacing:-.3px}
.services{direction:ltr;font:400 19px/1.5 Plex;margin:13px 0 0;color:#d3e0e8}
.line{width:48px;height:3px;background:#ee7638;margin:20px auto 0}
.caption{position:absolute;bottom:16px;left:0;width:100%;text-align:center;font:400 11px Plex;color:#aec0cc;direction:ltr;letter-spacing:.15px}
@media(min-height:900px){.photo{height:83%;object-position:center top}.shade{background:linear-gradient(180deg,rgba(5,25,40,.3),transparent 42%,#081f30 80%)}.brand{top:66px;width:320px}.copy{bottom:128px;width:920px}h1{font-size:78px}.en{font-size:43px}.services{font-size:27px;margin-top:22px}.line{margin-top:28px}.caption{bottom:44px;font-size:17px}}
</style>
<img class="photo" src="/social/park-concept-v1.jpg" alt="Generated amusement park concept at blue hour">
<div class="shade"></div>
<img class="brand" src="/brand/mg-group-white.svg" alt="MG Group">
<div class="copy">
  <h1>من الهندسة إلى التجربة</h1>
  <p class="en" lang="en">Amusement park engineering</p>
  <p class="services" lang="en">Installation · Commissioning · Operations</p>
  <div class="line"></div>
</div>
<div class="caption">RUSSIA · OMAN &nbsp; / &nbsp; GENERATED CONCEPT</div>
</html>
